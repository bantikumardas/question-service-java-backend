name: Pull Request Checks

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize]

jobs:
  build-question-service:
    name: Build Question Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: ./mvnw -B compile

  check-no-env-leak:
    name: Check No Env Variables Committed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a .env file was committed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          ENV_FILES=$(echo "$CHANGED_FILES" | grep -E '(^|/)\.env(\..*)?$' | grep -Ev '\.env\.(example|sample|template)$' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::.env file(s) must not be committed:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "OK: no .env file committed."

      - name: Fail if likely secret values were added
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PATTERN='(SECRET|PASSWORD|PASSWD|API[_-]?KEY|ACCESS[_-]?KEY|PRIVATE[_-]?KEY|TOKEN)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9/+_.\-]{8,}'
          HITS=$(git diff "$BASE_SHA" "$HEAD_SHA" | grep -E '^\+' | grep -Ev '^\+\+\+' | grep -Ei "$PATTERN" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Possible hard-coded secret/credential added in this PR:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no obvious hard-coded secrets found."
