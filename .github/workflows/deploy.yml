name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Write .env on the VM
        run: |
          printf '%s' "${{ secrets.ENV_FILE }}" | \
            ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'cat > ~/.env && chmod 600 ~/.env'

      - name: Pull image and restart container
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "IMAGE='${IMAGE}' \
             GH_ACTOR='${{ github.actor }}' \
             GH_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             bash -s" << 'ENDSSH'
          set -euo pipefail

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker pull "$IMAGE"

          docker network create app-net 2>/dev/null || true

          # Ensure Caddy is attached to app-net so it can resolve the "app" hostname.
          # Idempotent: succeeds silently if caddy is already connected or not present.
          docker network connect app-net caddy 2>/dev/null || true

          if ! docker ps -a --format '{{.Names}}' | grep -qx redis; then
            docker run -d \
              --name redis \
              --network app-net \
              --restart unless-stopped \
              -v ~/redisdata:/data \
              redis:7-alpine --appendonly yes
          fi

          docker rm -f app 2>/dev/null || true
          docker run -d \
            --name app \
            --network app-net \
            -p 8080:8080 \
            --memory=650m \
            --restart unless-stopped \
            --env-file ~/.env \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=none \
            -e REDIS_HOST=redis \
            "$IMAGE"

          docker logout ghcr.io
          docker image prune -f
          ENDSSH

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
                 'curl -sf localhost:8080/actuator/health' > /dev/null; then
              echo "Application is healthy."
              exit 0
            fi
            echo "Attempt $i: not up yet..."
            sleep 10
          done
          echo "::error::App failed to become healthy. Last 100 log lines:"
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'docker logs --tail 100 app'
          exit 1