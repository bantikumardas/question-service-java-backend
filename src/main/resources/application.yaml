spring:
  application:
    name: question-service

  datasource:
    url: jdbc:h2:file:${user.home}/.question-service/question_db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          min-idle: 2
          max-idle: 10
          max-active: 20

  jackson:
    serialization:
      write-dates-as-timestamps: false

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

invite:
  max-retry: 5
  mail-from: ${INVITE_MAIL_FROM:no-reply@question-service.com}
  executor:
    core-pool-size: ${INVITE_POOL_CORE:5}
    max-pool-size: ${INVITE_POOL_MAX:20}
    queue-capacity: ${INVITE_POOL_QUEUE:500}

jwt:
  secret: ${JWT_SECRET:questionServiceJwtSecretKey2026PleaseOverrideInProd!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.question.service: INFO
    org.hibernate.SQL: DEBUG

frontend:
  baseurl: ${FRONEND_BASE_URL:http://localhost:5173}

Admin:
  key: ${ADMIN_KEY:test-admin-key}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

