spring:
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_CONNECT_DESCRIPTOR}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_DB_USER}
    password: ${ORACLE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  flyway:
    locations: classpath:db/migration/{vendor}
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # application.yaml (base, shared across profiles) hardcodes H2Dialect for local dev.
        # Profile YAML merges with the base rather than replacing it, so this must be
        # overridden explicitly here or Oracle inherits the H2 dialect and breaks at startup.
        dialect: org.hibernate.dialect.OracleDialect
        # Oracle has no native UUID column type; map UUID attributes to CHAR(36)
        # instead of Hibernate's Oracle default of RAW(16), matching the migrations below.
        type:
          preferred_uuid_jdbc_type: CHAR

  h2:
    console:
      enabled: false
